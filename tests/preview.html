<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoundCloud Mini · Preview</title>
<style>
html{color-scheme:dark;background:#111215}body{margin:0;min-height:100vh;display:grid;place-content:center;gap:24px;font:14px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;color:#edeef1;padding:40px}body>div{width:320px;border-radius:16px;overflow:hidden;box-shadow:0 22px 75px #0006;border:1px solid #ffffff0c}header,footer{width:320px}h1{font-size:24px;letter-spacing:-.8px;margin:0 0 8px;font-weight:550}p{color:#999da8;margin:0}footer{display:flex;flex-wrap:wrap;gap:10px}footer button{font:inherit;font-size:12px;padding:9px 14px;border:1px solid #ffffff20;border-radius:8px;background:transparent;color:#ddd;cursor:pointer}footer button:hover{background:#ffffff0c}#status{font-size:12px;width:320px;min-height:38px}#results{max-width:480px;white-space:pre-wrap;font-size:12px;color:#bbcbb9}
</style>
<header><h1>A little room for your music.</h1><p>SoundCloud Mini · Interactive preview</p></header>
<footer><button id="pop">Pop out</button><button id="empty">Toggle empty state</button><button id="check">Check controls</button></footer>
<p id="status">Sample track. No audio plays in this preview.</p><pre id="results"></pre>
<script src="../core.js?v=2"></script><script src="../player.js?v=2"></script><script src="preview.js?v=2"></script></html>
