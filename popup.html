<h1>SoundCloud Mini</h1><p>On your SoundCloud tab, click <b>Mini-player</b> just above the playback bar.</p><p>The small <b>−</b> button hides the player. Your music keeps playing. Click Mini-player again to bring it back.</p><a href="https://soundcloud.com" target="_blank" rel="noopener">Open SoundCloud</a><p><small>Keep the SoundCloud tab open while listening.</small></p></html>
